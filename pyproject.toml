[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cg3d-maya"
version = "2.0.0"
authors = [
  { name="Nathaniel A", email="developer@3dcg.guru" },
]
description = "Maya workflow tools implemented without PyMEL"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


dependencies = [
    "cg3d-maya-core>=0.9.0",
    "wing-carrier==1.1.1",
]

[project.urls]
"Homepage" = "https://github.com/Nathanieljla/cg3d-maya"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.ui"]

